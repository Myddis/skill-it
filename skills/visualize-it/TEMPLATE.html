<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --border: #3d444d;
    }
  }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .summary { color: var(--muted); margin: 0 0 24px; }
  .diagram {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
  }
  ol { padding-left: 1.5rem; }
  li { margin: 6px 0; }
</style>
</head>
<body>
<main>
  <h1>{{TITLE}}</h1>
  <p class="summary">{{ONE_SENTENCE_SUMMARY}}</p>

  <section>
    <div class="diagram">
      <pre class="mermaid">
{{MERMAID_FLOWCHART}}
      </pre>
    </div>
    <h2>Steps</h2>
    <ol>
      {{STEP_LIST_ITEMS}}
    </ol>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: true,
    theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default",
  });
</script>
</body>
</html>
